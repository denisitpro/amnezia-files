name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      awg_version:
        description: amneziawg-go module version to build (empty = version.txt)
        required: false
        type: string
        default: ""
      publish:
        description: Create/update the GitHub release with the built assets
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      awg_version: ${{ steps.version.outputs.value }}
      go_version: ${{ steps.go-version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # Repo has no go.mod/go.sum; build.sh creates a throwaway module.
          cache: false

      - name: Lint scripts
        run: |
          set -euo pipefail
          bash -n keenetic/build.sh
          sh -n scripts/S99awg
          sh -n scripts/awg-v6block
          sh -n scripts/50-awg-v6.sh
          python3 -m py_compile scripts/conf2uapi.py

      - name: Resolve AWG_VERSION
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.awg_version }}" ]; then
            value="${{ inputs.awg_version }}"
          else
            value="$(tr -d '[:space:]' < version.txt)"
          fi
          if [ -z "$value" ]; then
            echo "::error::AWG_VERSION is empty (set workflow input or version.txt)" >&2
            exit 1
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Using AWG_VERSION=${value}"

      - name: Record Go version
        id: go-version
        run: echo "value=$(go version)" >> "$GITHUB_OUTPUT"

      - name: Build amneziawg-go
        env:
          AWG_VERSION: ${{ steps.version.outputs.value }}
        run: keenetic/build.sh

      - name: Stage release assets
        env:
          AWG_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist/amneziawg-go-${AWG_VERSION}-aarch64" release/amneziawg-go-linux-aarch64
          cp "dist/amneziawg-go-${AWG_VERSION}-mipsel" release/amneziawg-go-linux-mipsel
          cp "dist/amneziawg-go-${AWG_VERSION}-mips" release/amneziawg-go-linux-mips
          cp scripts/conf2uapi.py scripts/S99awg scripts/awg-v6block scripts/50-awg-v6.sh release/
          cp keenetic/tun-no-vnet-hdr.patch release/

          license_path="$(go env GOMODCACHE)/github.com/amnezia-vpn/amneziawg-go/v3@${AWG_VERSION}/LICENSE"
          if [ ! -f "$license_path" ]; then
            echo "::error::upstream LICENSE not found at $license_path" >&2
            exit 1
          fi
          cp "$license_path" release/LICENSE-amneziawg-go

          ( cd release && sha256sum -- * > SHA256SUMS )

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/

  publish:
    needs: build
    # PR builds must not publish. Push to main and manual runs (publish=true) do.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          AWG_VERSION: ${{ needs.build.outputs.awg_version }}
          GO_VERSION: ${{ needs.build.outputs.go_version }}
        run: |
          set -euo pipefail
          tag="keenetic-${AWG_VERSION}"
          notes="Upstream amneziawg-go: ${AWG_VERSION}
          Patch applied: drops IFF_VNET_HDR from tun/tun_linux.go (see keenetic/tun-no-vnet-hdr.patch)
          Targets: linux/arm64 (aarch64), linux/mipsle (mipsel), linux/mips (mips), CGO_ENABLED=0, GOMIPS=softfloat where applicable
          Go: ${GO_VERSION}
          Commit: ${GITHUB_SHA}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "amneziawg-go ${AWG_VERSION} for Keenetic" \
              --notes "$notes"
          fi
          gh release edit "$tag" --latest
